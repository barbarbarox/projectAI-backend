[program:redsim-ml]
process_name=%(program_name)s
command=/var/www/redsim/ml_service/.venv/bin/uvicorn main:app --host 127.0.0.1 --port 5001 --workers 1 --log-level info
directory=/var/www/redsim/ml_service
autostart=true
autorestart=true
startretries=5
stopasgroup=true
killasgroup=true
user=root
redirect_stderr=true
stdout_logfile=/var/log/redsim-ml.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=PYTHONUNBUFFERED="1"
